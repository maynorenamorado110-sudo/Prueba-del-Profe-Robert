<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Estudiantil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>REGISTRO ESTUDIANTIL</h1>

    <!-- Botón para seleccionar el archivo estudiantes.txt -->
    <div class="file-link-area">
      <button type="button" id="btnSelectFile" class="btn btn-orange">
        1. SELECCIONAR ESTUDIANTES.TXT
      </button>
      <span id="fileStatus" class="status-badge">Archivo no vinculado</span>
    </div>

    <!-- Formulario de ingreso y edición -->
    <form id="studentForm">
      <div class="form-group">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" placeholder="Ej. Carlos López" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="nie">NIE:</label>
          <input type="text" id="nie" placeholder="12345678" required>
        </div>

        <div class="form-group">
          <label for="edad">Edad:</label>
          <input type="number" id="edad" min="1" max="100" placeholder="16" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="grado">Grado:</label>
          <select id="grado" required>
            <option value="" disabled selected>Seleccionar</option>
            <option value="1.er Desarrollo de Software">1.er Desarrollo de Software</option>
            <option value="2.º Desarrollo de Software">2.º Desarrollo de Software</option>
            <option value="3.er Desarrollo de Software">3.er Desarrollo de Software</option>
          </select>
        </div>

        <div class="form-group">
          <label for="seccion">Sección:</label>
          <select id="seccion" required>
            <option value="" disabled selected>Seleccionar</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="correo">Correo:</label>
          <input type="email" id="correo" placeholder="carlos@gmail.com" required>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono:</label>
          <input type="tel" id="telefono" placeholder="70000000" required>
        </div>
      </div>

      <button type="submit" id="btnSubmit" class="btn btn-primary">REGISTRAR Y GUARDAR EN TXT</button>
      <button type="button" id="btnCancel" class="btn btn-secondary" style="display: none;">CANCELAR EDICIÓN</button>
    </form>

    <!-- Tabla con los datos registrados -->
    <h2>Estudiantes Registrados</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>NIE</th>
            <th>Edad</th>
            <th>Grado</th>
            <th>Sección</th>
            <th>Correo</th>
            <th>Teléfono</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Filas cargadas dinámicamente -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
